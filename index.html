<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-label="待辦清單應用程式">
    <header class="app__header">
      <h1>待辦清單</h1>
      <p>把今天要做的事情一項項完成。</p>
    </header>

    <section class="todo-input" aria-label="新增待辦事項">
      <label for="todoText" class="sr-only">待辦事項內容</label>
      <input id="todoText" type="text" placeholder="輸入待辦事項..." maxlength="200" />
      <button id="addButton" type="button">新增</button>
    </section>

    <section class="todo-list-section" aria-live="polite">
      <p id="emptyHint" class="empty-hint">還沒有任何待辦事項,新增一個吧!</p>
      <ul id="todoList" class="todo-list" aria-label="待辦事項清單"></ul>
    </section>

    <footer class="app__footer">
      <p id="pendingCount">未完成:0 項</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
